<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Download Page</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #f0f2f5; 
            color: #333; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .card { 
            background: #fff; 
            width: 100%; 
            max-width: 380px; 
            padding: 40px 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.08); 
            text-align: center; 
        }
        .app-logo {
            width: 90px;
            height: 90px;
            border-radius: 20px;
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h1 {
            font-size: 24px;
            margin: 0 0 8px 0;
            color: #111;
        }
        .version {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
        }
        .btn { 
            display: block; 
            background: #0066ff; 
            color: #fff; 
            padding: 14px; 
            text-decoration: none; 
            border-radius: 8px; 
            font-weight: 600; 
            font-size: 16px;
            transition: background 0.2s;
            box-shadow: 0 4px 12px rgba(0,102,255,0.3);
        } 
        .btn:hover { 
            background: #0052cc; 
        }
        .stats { 
            margin-top: 20px; 
            color: #555; 
            font-size: 14px; 
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- App Logo ပုံထည့်ရန် (logo.png နေရာတွင် ကိုယ့်ပုံလင့် သို့မဟုတ် ပုံဖိုင်နာမည်ထည့်ပါ) -->
        <img src="logo.png" alt="App Logo" class="app-logo">
        
        <h1>My Awesome App</h1>
        <div class="version" id="app-version">ဗားရှင်း: Loading...</div>
        
        <!-- Download Button -->
        <a id="download-btn" href="#" class="btn" target="_blank">APK ဒေါင်းလုဒ်လုပ်ရန်</a>
        
        <!-- Download Count -->
        <div class="stats" id="download-count">ဒေါင်းလုဒ်အရေအတွက်: စစ်ဆေးနေသည်...</div>
    </div>

    <script>
        // GitHub API မှတဆင့် Release အချက်အလက်များကို ယူခြင်း
        fetch('https://api.github.com/repos/YOUR_USERNAME/YOUR_REPO/releases/latest')
            .then(response => response.json())
            .then(data => {
                // APK Download URL
                const apkUrl = data.assets[0].browser_download_url;
                document.getElementById('download-btn').href = apkUrl;

                // Download Count (ဒေါင်းလုပ်ဆွဲထားသည့် အကြိမ်ရေ)
                const downloadCount = data.assets[0].download_count;
                document.getElementById('download-count').innerText = `📥 ဒေါင်းလုဒ်ဆွဲထားသူ: ${downloadCount} ကြိမ်`;

                // App Version
                const versionName = data.tag_name;
                document.getElementById('app-version').innerText = `ဗားရှင်း ${versionName} • Android`;
            })
            .catch(error => {
                console.error('Error fetching release data:', error);
                document.getElementById('download-count').innerText = 'ဒေါင်းလုဒ်အချက်အလက် ရယူ၍မရပါ။';
                document.getElementById('app-version').innerText = 'Android App';
            });
    </script>

</body>
</html>
