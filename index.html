<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A VPN PRO - Official Download</title>
    <style>
        /* CSS Reset & Global Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Main Container Card Style */
        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        /* App Logo Styling */
        .app-logo {
            width: 110px;
            height: 110px;
            border-radius: 26px;
            object-fit: cover;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
            border: 2px solid rgba(255, 255, 255, 0.15);
        }

        /* Typography */
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
        }
        .version {
            font-size: 15px;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        /* Features Section */
        .features {
            display: flex;
            justify-content: space-around;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .feature-item {
            font-size: 13px;
            color: #cbd5e1;
        }
        .feature-item span {
            display: block;
            font-size: 15px;
            font-weight: 600;
            color: #38bdf8;
            margin-top: 4px;
        }

        /* Download Button Styling */
        .btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff;
            padding: 16px;
            text-decoration: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 17px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
            margin-bottom: 15px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.6);
        }

        /* Download Stats Box */
        .stats {
            color: #94a3b8;
            font-size: 14px;
            background: rgba(15, 23, 42, 0.3);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        /* Footer Section */
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- App Logo Image -->
        <img src="avpnpro.png" alt="App Logo" class="app-logo">
        
        <!-- App Title & Version -->
        <h1>A VPN PRO</h1>
        <div class="version" id="app-version">ဗားရှင်း v1.0.0 • Android</div>

        <!-- App Features Highlights -->
        <div class="features">
            <div class="feature-item">လုံခြုံရေး <span>100% Secure</span></div>
            <div class="feature-item">အမြန်နှုန်း <span>High Speed</span></div>
            <div class="feature-item">ကြော်ငြာ <span>No Ads</span></div>
        </div>
        
        <!-- Direct APK Download Button -->
        <a href="https://github.com/ahlflk/ahlflk2025/releases/download/v1.0.0/A.VPN.PRO_v1.0.0..apk" class="btn" target="_blank">APK ဒေါင်းလုဒ်လုပ်ရန်</a>
        
        <!-- Dynamic Download Counter Box -->
        <div class="stats" id="download-count">📥 ဒေါင်းလုဒ်အရေအတွက်: စစ်ဆေးနေသည်...</div>

        <!-- Page Footer -->
        <div class="footer">
            Powered by GitHub Pages
        </div>
    </div>

    <!-- JavaScript for Fetching GitHub Release Download Statistics -->
    <script>
        fetch('https://api.github.com/repos/ahlflk/ahlflk2025/releases')
            .then(response => response.json())
            .then(data => {
                if (data && data.length > 0) {
                    let totalDownloads = 0;
                    data[0].assets.forEach(asset => {
                        totalDownloads += asset.download_count;
                    });
                    document.getElementById('download-count').innerText = `📥 ဒေါင်းလုဒ်ဆွဲထားသူ: ${totalDownloads} ကြိမ်`;
                } else {
                    document.getElementById('download-count').innerText = `📥 ဒေါင်းလုဒ်ဆွဲထားသူ: 0 ကြိမ်`;
                }
            })
            .catch(error => {
                console.error('Error fetching download count:', error);
                document.getElementById('download-count').innerText = '📥 ဒေါင်းလုဒ်အရေအတွက်: ရယူပြီးပါပြီ';
            });
    </script>

</body>
</html>
