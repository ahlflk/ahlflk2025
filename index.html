<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A VPN Pro - Download</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #f0f2f5; 
            color: #333; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .card { 
            background: #fff; 
            width: 100%; 
            max-width: 380px; 
            padding: 40px 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.08); 
            text-align: center; 
        }
        .app-logo {
            width: 90px;
            height: 90px;
            border-radius: 20px;
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h1 {
            font-size: 24px;
            margin: 0 0 8px 0;
            color: #111;
        }
        .version {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
        }
        .btn { 
            display: block; 
            background: #0066ff; 
            color: #fff; 
            padding: 14px; 
            text-decoration: none; 
            border-radius: 8px; 
            font-weight: 600; 
            font-size: 16px;
            transition: background 0.2s;
            box-shadow: 0 4px 12px rgba(0,102,255,0.3);
        } 
        .btn:hover { 
            background: #0052cc; 
        }
        .stats { 
            margin-top: 20px; 
            color: #555; 
            font-size: 14px; 
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- App Logo ပုံ (avpnpro.png သည် Repository ထဲတွင် ရှိနေရပါမည်) -->
        <img src="avpnpro.png" alt="App Logo" class="app-logo">
        
        <h1>A VPN PRO</h1>
        <div class="version">ဗားရှင်း v1.0.0.1 • Android</div>
        
        <!-- APK Direct Download Link -->
        <a href="https://github.com/ahlflk/ahlflk2025/releases/download/v1.0.0/A.VPN.PRO_v1.0.0.1.apk" class="btn" target="_blank">APK ဒေါင်းလုဒ်လုပ်ရန်</a>
        
        <!-- GitHub Release Download Count ကို တိုက်ရိုက်ဆွဲယူမည့် API -->
        <div class="stats" id="download-count">ဒေါင်းလုဒ်အရေအတွက်: စစ်ဆေးနေသည်...</div>
    </div>

    <script>
        // GitHub API မှ Download အရေအတွက် (Download Count) ကို သီးသန့်ဆွဲထုတ်ခြင်း
        fetch('https://api.github.com/repos/ahlflk/ahlflk2025/releases')
            .then(response => response.json())
            .then(data => {
                if (data && data.length > 0) {
                    let totalDownloads = 0;
                    // Release ထဲရှိ asset တိုင်း၏ ဒေါင်းလုဒ်အရေအတွက်များကို ပေါင်းပြရန်
                    data[0].assets.forEach(asset => {
                        totalDownloads += asset.download_count;
                    });
                    document.getElementById('download-count').innerText = `📥 ဒေါင်းလုဒ်ဆွဲထားသူ: ${totalDownloads} ကြိမ်`;
                } else {
                    document.getElementById('download-count').innerText = `📥 ဒေါင်းလုဒ်ဆွဲထားသူ: 0 ကြိမ်`;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('download-count').innerText = '📥 ဒေါင်းလုဒ်အရေအတွက် ရယူပြီးပါပြီ';
            });
    </script>

</body>
</html>
